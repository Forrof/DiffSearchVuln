name: DiffSearchVuln
options:
  bundleIdPrefix: local.diffsearchvuln
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
packages:
  DiffSearchVulnCore:
    path: ../DiffSearchVulnCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  DiffSearchVuln:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: DiffSearchVulnCore
        product: DiffSearchVulnCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.diffsearchvuln.app
        PRODUCT_NAME: DiffSearchVuln
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
    scheme:
      environmentVariables:
        DIFFSEARCHVULN_REPOSITORY_ROOT: "$(SRCROOT)/../.."
